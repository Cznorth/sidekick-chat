# 推 v<版本> 标签时自动发布到 npm,走 npm 可信发布(OIDC),不需要 npm 令牌和两步验证。
# 一次性设置:npmjs.com → sidekick-chat → Settings → Trusted Publisher → GitHub Actions,
# 填 Cznorth / sidekick-chat / publish.yml。
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 标签和 package.json 版本一致
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: node --test
      - name: 已发过就跳过
        id: check
        run: |
          if npm view "sidekick-chat@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo skip=1 >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != '1'
        run: npm publish --access public
